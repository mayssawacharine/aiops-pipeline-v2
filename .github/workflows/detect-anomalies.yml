name: Detect CI Anomalies

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch workflow metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python scripts/fetch_metrics.py
      - name: Train model
        run: python scripts/train_model.py
      - name: Detect latest run
        id: detect
        run: |
          python scripts/detect_latest_run.py > detection_output.json
          cat detection_output.json
      - name: Upload detection artifact
        uses: actions/upload-artifact@v4
        with:
          name: latest-detection
          path: |
            data/latest_detection.json
            data/scored_runs.csv
            data/anomalies.png
      - name: Mark anomaly
        id: mark
        run: |
          python - <<'PY'
          import json, os
          with open('data/latest_detection.json') as f:
              result = json.load(f)
          is_anomaly = result['anomaly_label'] == -1
          if is_anomaly:
              print('::warning title=Anomaly Detected::Latest CI run looks anomalous')
          else:
              print('Latest run looks normal')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"is_anomaly={'true' if is_anomaly else 'false'}\n")
              out.write(f"run_id={result['run_id']}\n")
              out.write(f"duration={result['duration_seconds']}\n")
              out.write(f"score={result['anomaly_score']}\n")
          PY

      - name: Send email alert
        if: steps.mark.outputs.is_anomaly == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_ADDRESS }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "🚨 Anomalie détectée - aiops-pipeline-v2"
          to: ${{ secrets.GMAIL_ADDRESS }}
          from: AIOps Pipeline Alert
          body: |
            Une anomalie a été détectée dans le pipeline CI/CD.

            Run ID: ${{ steps.mark.outputs.run_id }}
            Durée: ${{ steps.mark.outputs.duration }}s
            Score d'anomalie: ${{ steps.mark.outputs.score }}

            Voir le dashboard : https://aiops-pipeline-v2-1.onrender.com/dashboard
